# 8つの評価軸。usage・development は P/U 区分から自動算出、残り6軸は編集部の目安（1〜5）。
version: 0.2.0
items:
  - { id: usage, ja: 利用規模, derived: true, anchors: { 1: 1万人未満（U1）, 3: 100万〜1000万人（U3）, 5: 1000万人以上（U4） } }
  - { id: development, ja: 開発規模, derived: true, anchors: { 1: 10人月未満（XS）, 3: 100〜500人月（M）, 5: 5000人月以上（XL〜XXL） } }
  - { id: technical, ja: 技術規模, anchors: { 1: 単機能・外部接続なし, 3: 数十の機能・数個の外部接続, 5: 数百の機能・数十の外部接続 } }
  - { id: organization, ja: 組織規模, anchors: { 1: 1チームで開発・運用, 3: 複数の会社・数十人が関与, 5: 数十社・数千人が関与 } }
  - { id: criticality, ja: 重要度（停止影響）, anchors: { 1: 止まっても手作業で代替できる, 3: 止まると企業の業務が止まる, 5: 止まると社会や人命に重大な影響 } }
  - { id: longevity, ja: 継続期間, anchors: { 1: 数か月〜数年で入れ替わる, 3: 10年前後使われる, 5: 数十年稼働し、刷新を繰り返す } }
  - { id: regulation, ja: 規制・責任, anchors: { 1: 特別な法令上の要求はない, 3: 個人情報保護・会計監査などの要求, 5: 業法・監督官庁・安全基準による厳格な要求 } }
  - { id: changeability, ja: 変更難易度, anchors: { 1: いつでも変更・停止できる, 3: 計画的な停止と移行が必要, 5: 止められず、変更に年単位の準備が必要 } }
