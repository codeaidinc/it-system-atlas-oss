# IT産業の役割（教材カードの「関わる企業の種類」、ライフサイクル地図の「担う組織」）
version: 0.2.0
items:
  - { id: owner, ja: 発注者・システムの所有者, desc: システムを企画し、投資し、所有する企業・団体 }
  - { id: operator, ja: 運営者, desc: システムを使ってサービスを提供・運営する組織 }
  - { id: prime_sier, ja: 元請SIer, desc: 発注者から開発・構築を一括で請け負う企業 }
  - { id: partner, ja: 協力会社（二次請け・SES）, desc: SIerの下で設計・開発・テストを担う企業や技術者 }
  - { id: vendor, ja: 製品・基盤ベンダー, desc: パッケージ・ミドルウェア・ハードウェア・クラウドを提供する企業 }
  - { id: saas_provider, ja: SaaS・サービス提供者, desc: 自社のサービスとして開発・運営・提供する企業 }
  - { id: ops_provider, ja: 運用・保守会社, desc: 稼働後の監視・保守・障害対応を担う企業 }
  - { id: consultant, ja: コンサルティング会社, desc: 構想・企画・業務改革を支援する企業 }
  - { id: regulator, ja: 監督官庁・業界団体, desc: 基準やルールを定め、監督する組織 }
