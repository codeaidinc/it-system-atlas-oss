id: st-fraud-detection
type: system_type
names:
  ja: 不正検知システム
  en: Fraud Detection System
aliases:
- 不正利用検知
summary:
  ja: カード決済や送金の取引データを分析し、なりすましや不正利用の疑いがある取引を見つけて止めるシステム。統計やAIによる判定が使われる。
domain: D05
level:
  primary: L3
  related:
  - L0
scope: enterprise
industry:
- finance.payments
- finance.banking
business_function:
- bf.risk_compliance
category: security
layer: application
users:
  ja: カード会社、銀行、決済事業者
purpose:
  ja: 不正な取引による被害を防ぐ
functions:
- 取引の監視
- 不正の疑いの判定
- 取引の保留・停止
- 担当者への通知
events:
- カード利用・送金の発生
- いつもと違う場所や金額での取引
qualities:
- 判定の速さ
- 誤検知の少なさ
- セキュリティ
outage_impact:
  ja: 不正な取引を見逃しやすくなり、被害が広がるおそれがある。
