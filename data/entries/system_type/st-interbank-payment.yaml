id: st-interbank-payment
type: system_type
names:
  ja: 銀行間決済システム
  en: Interbank Payment System
aliases:
- 全銀システム
- 為替決済
summary:
  ja: 異なる銀行の口座の間で振込などのお金のやり取りを処理し、銀行同士の決済を行うシステム。日本では全銀システムが中心的な役割を担う。
domain: D05
level:
  primary: L5
scope: society
industry:
- finance.banking
- finance.payments
business_function:
- bf.service_delivery
category: social_infrastructure
layer: integration
users:
  ja: 銀行などの金融機関。間接的には振込を行うすべての人
purpose:
  ja: 銀行をまたぐ送金を安全・確実に処理する
functions:
- 銀行間の振込データの中継
- 銀行同士の決済金額の計算
- 決済の確定
events:
- 各銀行からの振込データの送信
- 一日の決済の締め
qualities:
- 正確性
- 可用性
- 処理能力
- セキュリティ
outage_impact:
  ja: 銀行をまたぐ振込が全国で止まり、給与や代金の支払いに広く影響する。
