id: st-erp
type: system_type
names:
  ja: ERP（統合基幹業務システム）
  en: Enterprise Resource Planning
aliases:
- ERP
- 統合基幹業務パッケージ
summary:
  ja: 会計・販売・購買・在庫・生産・人事などの基幹業務のデータを一つに統合して管理するシステム。大企業ではグループ全体で導入されることが多い。
domain: D03
level:
  primary: L4
  related:
  - L3
scope: group
industry:
- cross_industry
